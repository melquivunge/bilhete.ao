[www]
; Endpoint de ping usado pelo healthcheck do serviço "app" no Compose.
; Não expõe estado interno: responde apenas "pong".
ping.path = /ping
ping.response = pong

; O status detalhado do pool fica desligado: exporia contagens de processos e
; pedidos sem qualquer autenticação.
; pm.status_path não é definido, de propósito.

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
