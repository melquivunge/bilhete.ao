; Configuração de desenvolvimento. Produção terá a sua própria, no Marco 7.

memory_limit = 512M

; PHPStan é invocado com --memory-limit próprio (KI-007); este valor cobre a
; aplicação e os testes.

max_execution_time = 60
post_max_size = 20M
upload_max_filesize = 20M

expose_php = Off

date.timezone = UTC

; Erros vão para o stderr do container, para ficarem visíveis em docker logs.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
